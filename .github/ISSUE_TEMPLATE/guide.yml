name: تصحيح أو شرح جديد / Guide fix or new guide
description: خطأ في شرح موجود، أو شرح ناقص تريد إضافته / A mistake in an existing guide, or a missing guide to add
labels:
  - guides
body:
  - type: input
    id: guide
    attributes:
      label: أي شرح؟ / Which guide?
      placeholder: getting-started, billing, شرح جديد...
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: التفاصيل / Details
      description: ما الذي يحتاج إلى تصحيح أو إضافة؟ / What is wrong or missing?
    validations:
      required: true
