# yaml-language-server: $schema=./serverk.schema.json
schemaVersion: serverk.gg/v1
kind: GuidePackage

metadata:
  id: platform

guideTags:
  - id: start
    name:
      ar: ابدأ من هنا
      en: Start here
  - id: billing
    name:
      ar: الفوترة
      en: Billing
  - id: account
    name:
      ar: الحساب
      en: Account

guides:
  - id: getting-started
    title:
      ar: أول سيرفر لك على سيرفرك
      en: Your first server on Serverk
    summary:
      ar: من إنشاء الحساب حتى سيرفر شغال — الرحلة كاملة خطوة بخطوة.
      en: From creating an account to a running server — the whole journey, step by step.
    tags:
      - start
    surfaces:
      - overview
    bodyPath:
      ar: guides/getting-started/ar.md
      en: guides/getting-started/en.md

  - id: panel-basics
    title:
      ar: جولة في لوحة التحكم
      en: A tour of the panel
    summary:
      ar: نظرة عامة، الكونسول، الملفات، والإعدادات — وش تسوي في كل تبويب.
      en: Overview, console, files and settings — what each tab is for.
    tags:
      - start
    surfaces:
      - overview
    bodyPath:
      ar: guides/panel-basics/ar.md
      en: guides/panel-basics/en.md

  - id: backups
    title:
      ar: النسخ الاحتياطية
      en: Backups
    summary:
      ar: وش تحفظ النسخة، متى ناخذها لك، النسخة الخارجية والتنزيل، والرجوع لنسخة.
      en: What a backup holds, when we take one for you, the off-site copy and downloads, and how to restore.
    tags:
      - start
    surfaces:
      - backups
      - overview
    bodyPath:
      ar: guides/backups/ar.md
      en: guides/backups/en.md

  - id: rcon
    title:
      ar: الوصول عن بُعد (RCON)
      en: Remote access (RCON)
    summary:
      ar: افتح RCON لسيرفرك عشان تديره بأدوات خارجية — التشغيل، كلمة المرور، الأمان، وكل لعبة ووضعها.
      en: Open RCON so external tools can manage your server — turning it on, the password, security, and where each game stands.
    tags:
      - start
    surfaces:
      - panel
      - overview
    bodyPath:
      ar: guides/rcon/ar.md
      en: guides/rcon/en.md

  - id: sftp
    title:
      ar: نقل الملفات (SFTP)
      en: File transfer (SFTP)
    summary:
      ar: انقل مجلداتك ومودّاتك وعوالمك ببرنامج على جهازك — بيانات الاتصال، FileZilla و WinSCP.
      en: Move folders, mods and worlds with a desktop program — your connection details, FileZilla and WinSCP.
    tags:
      - start
    surfaces:
      - files
      - overview
    bodyPath:
      ar: guides/sftp/ar.md
      en: guides/sftp/en.md

  - id: moving-in
    title:
      ar: انقل سيرفرك من استضافة ثانية
      en: Move your server in from another host
    summary:
      ar: عالمك ومودّاتك وإعداداتك تجي معك — ملف مضغوط من اللوحة، أو SFTP، أو تذكرة نقل ننقلها لك مجاناً.
      en: Bring your world, mods and settings across — an archive from the panel, SFTP, or a migration ticket we handle for free.
    tags:
      - start
    surfaces:
      - files
      - overview
    bodyPath:
      ar: guides/moving-in/ar.md
      en: guides/moving-in/en.md

  - id: own-domain
    title:
      ar: استخدم دومينك الخاص
      en: Use your own domain
    summary:
      ar: خلّ لاعبينك يدخلون من دومينك — سجل SRV لماينكرافت جافا، وسجل CNAME لباقي الألعاب.
      en: Let your players join through your own domain — an SRV record for Minecraft Java, a CNAME for every other game.
    tags:
      - start
    surfaces:
      - panel
      - overview
    bodyPath:
      ar: guides/own-domain/ar.md
      en: guides/own-domain/en.md

  - id: billing
    title:
      ar: الفوترة وتمديد سيرفرك
      en: Billing and extending your server
    summary:
      ar: كيف تشتغل الأسعار بالريال، متى ينتهي سيرفرك، وكيف تمدده قبل ما يتوقف.
      en: How SAR pricing works, when your server expires, and how to extend it in time.
    tags:
      - billing
    bodyPath:
      ar: guides/billing/ar.md
      en: guides/billing/en.md

  - id: payments
    title:
      ar: طرق الدفع
      en: Payment methods
    summary:
      ar: مدى، Apple Pay، والبطاقات الائتمانية — وكيف تعيد محاولة دفعة فشلت.
      en: mada, Apple Pay and credit cards — and how to retry a failed payment.
    tags:
      - billing
    bodyPath:
      ar: guides/payments/ar.md
      en: guides/payments/en.md

  - id: discord
    title:
      ar: اربط حسابك بديسكورد
      en: Connect your Discord
    summary:
      ar: انضم لمجتمع سيرفرك واربط حسابك عشان تتابع سيرفراتك من ديسكورد.
      en: Join the Serverk community and link your account to follow your servers from Discord.
    tags:
      - account
    bodyPath:
      ar: guides/discord/ar.md
      en: guides/discord/en.md
