# yaml-language-server: $schema=./serverk.schema.json
schemaVersion: serverk.gg/v1
kind: GuidePackage

metadata:
  id: platform

guideTags:
  - id: start
    name:
      ar: ابدأ من هنا
      en: Start here
  - id: billing
    name:
      ar: الفوترة
      en: Billing
  - id: account
    name:
      ar: الحساب
      en: Account
  - id: games
    name:
      ar: سيرفرات الألعاب
      en: Game servers

guides:
  - id: getting-started
    title:
      ar: أول سيرفر لك على منصة سيرفرك
      en: Your first server on Serverk
    summary:
      ar: من إنشاء الحساب حتى سيرفر شغّال، الرحلة كاملة خطوة بخطوة.
      en: From creating an account to a running server, the whole journey step by step.
    tags:
      - start
      - games
    surfaces:
      - overview
    bodyPath:
      ar: guides/getting-started/ar.md
      en: guides/getting-started/en.md

  - id: before-you-buy
    title:
      ar: تحقق من البنق قبل الشراء
      en: Check your ping before you buy
    summary:
      ar: اعرف بنقك إلى كل منطقة دون أن تملك سيرفرًا، وجرب سيرفرًا حقيقيًا مجانًا عندما تكون التجربة متاحة، وما يحدث عند انتهائها.
      en: Know your ping to each region without owning a server, try a real server free when the trial is open, and what happens when it ends.
    tags:
      - start
      - games
    bodyPath:
      ar: guides/before-you-buy/ar.md
      en: guides/before-you-buy/en.md

  - id: panel-basics
    title:
      ar: جولة في اللوحة
      en: A tour of the panel
    summary:
      ar: "نظرة عامة، والكونسول، والملفات، والإعدادات: ما يقدّمه لك كل تبويب."
      en: "Overview, console, files and settings: what each tab is for."
    tags:
      - start
      - games
    surfaces:
      - overview
    bodyPath:
      ar: guides/panel-basics/ar.md
      en: guides/panel-basics/en.md

  - id: access
    title:
      ar: ادعُ أصحابك وشاركهم لوحة سيرفرك
      en: Invite your friends and share your panel
    summary:
      ar: "دعوات اللاعبين للقائمة البيضاء، والأعضاء بحساباتهم، وروابط المشاركة: من يدخل سيرفرك وبأي صلاحيات."
      en: "Player invites for the whitelist, members with their own accounts, and share links: who gets into your server, and with which permissions."
    tags:
      - start
      - games
    surfaces:
      - overview
      - setup
    bodyPath:
      ar: guides/access/ar.md
      en: guides/access/en.md

  - id: backups
    title:
      ar: النسخ الاحتياطية
      en: Backups
    summary:
      ar: ما تحفظه النسخة الاحتياطية، ومتى نأخذها لك، والنسخة الخارجية والتنزيل، واسترجاع نسخة.
      en: What a backup holds, when we take one for you, the off-site copy and downloads, and how to restore.
    tags:
      - start
      - games
    surfaces:
      - backups
      - overview
    bodyPath:
      ar: guides/backups/ar.md
      en: guides/backups/en.md

  - id: schedules
    title:
      ar: المهام المجدولة
      en: Scheduled tasks
    summary:
      ar: "ريستارت كل ليلة، أو أمر كونسول، أو نسخة احتياطية في وقت تحدده: التكرار، والخطوات، وما يحدث عند التنفيذ."
      en: "A nightly restart, a console command or a backup at the time you set: repeats, steps, and what happens when it runs."
    tags:
      - games
    surfaces:
      - overview
      - backups
    bodyPath:
      ar: guides/schedules/ar.md
      en: guides/schedules/en.md

  - id: crashes
    title:
      ar: عندما يتعطّل سيرفرك أو لا يشتغل
      en: When your server crashes or won't start
    summary:
      ar: "ماذا نفعل عند التعطّل، وأين تجد السبب وحله، وكيف تقرأ الكونسول، وماذا تفعل عند امتلاء المساحة."
      en: "What we do when it crashes, where to find the cause and its fix, how to read the console, and what to do when the disk is full."
    tags:
      - start
      - games
    surfaces:
      - overview
      - console
    bodyPath:
      ar: guides/crashes/ar.md
      en: guides/crashes/en.md

  - id: rcon
    title:
      ar: الوصول عن بُعد (RCON)
      en: Remote access (RCON)
    summary:
      ar: "افتح RCON لسيرفرك لتديره بأدوات خارجية: التشغيل، وكلمة المرور، والأمان، ووضع كل لعبة."
      en: "Open RCON so external tools can manage your server: turning it on, the password, security, and where each game stands."
    tags:
      - start
      - games
    surfaces:
      - panel
      - overview
    bodyPath:
      ar: guides/rcon/ar.md
      en: guides/rcon/en.md

  - id: sftp
    title:
      ar: نقل الملفات (SFTP)
      en: File transfer (SFTP)
    summary:
      ar: "انقل مجلداتك وموداتك ومابك ببرنامج على جهازك: بيانات الاتصال، وبرنامجا FileZilla و WinSCP."
      en: "Move folders, mods and worlds with a desktop program: your connection details, FileZilla and WinSCP."
    tags:
      - start
      - games
    surfaces:
      - files
      - overview
    bodyPath:
      ar: guides/sftp/ar.md
      en: guides/sftp/en.md

  - id: moving-in
    title:
      ar: انقل سيرفرك من استضافة أخرى
      en: Move your server in from another host
    summary:
      ar: "مابك وموداتك وإعداداتك تنتقل معك: ملف مضغوط من اللوحة، أو SFTP، أو تذكرة نقل وننقلها لك مجانًا."
      en: "Bring your world, mods and settings across: an archive from the panel, SFTP, or a migration ticket we handle for free."
    tags:
      - start
      - games
    surfaces:
      - files
      - overview
    bodyPath:
      ar: guides/moving-in/ar.md
      en: guides/moving-in/en.md

  - id: own-domain
    title:
      ar: استخدم دومينك الخاص
      en: Use your own domain
    summary:
      ar: "اجعل لاعبيك يدخلون من دومينك: سجل SRV لماينكرافت جافا، وسجل CNAME لبقية الألعاب."
      en: "Let your players join through your own domain: an SRV record for Minecraft Java, a CNAME for every other game."
    tags:
      - start
      - games
    surfaces:
      - panel
      - overview
    bodyPath:
      ar: guides/own-domain/ar.md
      en: guides/own-domain/en.md

  - id: billing
    title:
      ar: الفوترة وتمديد اشتراكك
      en: Billing and extending your subscription
    summary:
      ar: كيف تُحسب الأسعار، ومتى ينتهي اشتراكك، وكيف تمدده قبل أن يتوقف.
      en: How pricing works, when your subscription ends, and how to extend it in time.
    tags:
      - billing
    bodyPath:
      ar: guides/billing/ar.md
      en: guides/billing/en.md

  - id: payments
    title:
      ar: طرق الدفع
      en: Payment methods
    summary:
      ar: مدى و Apple Pay والبطاقات الائتمانية، وطريقة إعادة محاولة دفع لم يكتمل.
      en: mada, Apple Pay and credit cards, and how to retry a failed payment.
    tags:
      - billing
    bodyPath:
      ar: guides/payments/ar.md
      en: guides/payments/en.md

  - id: discord
    title:
      ar: اربط حسابك بديسكورد
      en: Connect your Discord
    summary:
      ar: انضم إلى مجتمع منصة سيرفرك واربط حسابك لتتابع سيرفراتك من ديسكورد.
      en: Join the Serverk community and link your account to follow your servers from Discord.
    tags:
      - account
      - games
    bodyPath:
      ar: guides/discord/ar.md
      en: guides/discord/en.md
